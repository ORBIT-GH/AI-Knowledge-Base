name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build Python distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Build Windows desktop executable
        run: |
          python -m pip install ".[desktop]"
          pyinstaller --noconfirm --clean --onefile --windowed --name AIKnowledgeBase --icon src/futures_kb/resources/ai-knowledge.ico --add-data "src/futures_kb/resources/ai-knowledge.ico;futures_kb/resources" --distpath dist/desktop --workpath build/desktop --specpath build/desktop src/futures_kb/desktop.py

      - name: Build source archive
        shell: pwsh
        run: |
          git archive --format=zip --output="dist/futures-ai-kb-$env:GITHUB_REF_NAME-source.zip" HEAD

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @()
          $assets += Get-ChildItem -Path dist -File | ForEach-Object { $_.FullName }
          $assets += (Resolve-Path "dist/desktop/AIKnowledgeBase.exe").Path
          gh release create $env:GITHUB_REF_NAME @assets --title "Futures AI KB $env:GITHUB_REF_NAME" --generate-notes
