[project]
name = "futures-ai-kb"
version = "0.2.1"
description = "External futures data and on-demand report service for OpenClaw"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Futures AI KB contributors" }]
requires-python = ">=3.12"
keywords = ["futures", "openclaw", "mcp", "market-data", "reporting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "fastapi>=0.141,<0.142",
  "mcp>=2.2,<3",
  "tzdata>=2025.2",
  "uvicorn>=0.53,<0.54",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8.4,<9",
]

[project.scripts]
futures-kb-api = "futures_kb.api:main"
futures-kb-mcp = "futures_kb.mcp_server:main"
futures-kb-seed = "futures_kb.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/futures_kb"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/skills",
  "/config",
  "/examples",
  "/scripts",
  "/.github",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/.env.example",
  "/.gitattributes",
  "/.editorconfig",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
